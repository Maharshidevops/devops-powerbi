services:
  postgres:
    image: postgres:16-alpine
    container_name: retailops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailops}
      POSTGRES_USER: ${POSTGRES_USER:-retailops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:4.1.1
    container_name: retailops-superset
    profiles: ["bi"]
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: change_this_for_real_deployments
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    container_name: retailops-airflow-webserver
    profiles: ["airflow"]
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops_dev_password}@postgres:5432/${POSTGRES_DB:-retailops}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary==2.9.9 python-dotenv==1.0.1
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    container_name: retailops-airflow-scheduler
    profiles: ["airflow"]
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops_dev_password}@postgres:5432/${POSTGRES_DB:-retailops}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary==2.9.9 python-dotenv==1.0.1
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    container_name: retailops-airflow-init
    profiles: ["airflow"]
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Retail --lastname Ops --role Admin --email admin@example.com || true"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-retailops}:${POSTGRES_PASSWORD:-retailops_dev_password}@postgres:5432/${POSTGRES_DB:-retailops}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary==2.9.9 python-dotenv==1.0.1
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
