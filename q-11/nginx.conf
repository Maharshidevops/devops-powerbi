server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing  React Router needs this.
    # Every path that doesn't match a real file on disk falls back
    # to index.html so the client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    # Vite fingerprints JS/CSS filenames with a content hash, so
    # it's safe to cache for 1 year  a new deploy produces new
    # filenames and busts the cache automatically.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ALB health check endpoint.
    # Returns 200 immediately without touching the filesystem.
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Security headers  defence in depth.
    # X-Frame-Options prevents clickjacking.
    # X-Content-Type-Options stops MIME sniffing.
    # Referrer-Policy limits referrer header leakage.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Don't expose nginx version in error pages or headers
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
