name: CI/CD — vidstream

# Triggers on every push to main.
# workflow_dispatch lets me kick off a manual run when I need to
# redeploy without a code change (e.g. after a config update).
on:
  push:
    branches: [main]
  workflow_dispatch:

# If two pushes land quickly, cancel the older run.
# No point finishing a deploy that's already stale.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:  us-east-1
  ECR_REPO:    vidstream-api
  ECS_CLUSTER: vidstream-cluster

jobs:

  # ── BUILD ────────────────────────────────────────────────────
  # Tags the image with the full git SHA, not "latest".
  # Reason: "latest" in prod means you have no idea what's actually
  # running. With a SHA tag I can look at ECS, see the image tag,
  # and immediately know which commit and PR introduced a bug.
  #
  # SECRETS / CREDENTIALS — nothing is hardcoded, ever.
  # We use GitHub OIDC instead of long-lived IAM access keys.
  # Setup (one-time, done by infra team):
  #   1. Create an IAM Identity Provider in AWS for token.actions.githubusercontent.com
  #   2. Create an IAM role with a trust policy scoped to this repo
  #   3. Store only the role ARN in GitHub Secrets as AWS_DEPLOY_ROLE_ARN
  # When the job runs, GitHub mints a short-lived JWT. The
  # configure-aws-credentials action swaps it for temp AWS creds
  # (valid ~1 hour). No static keys, nothing to rotate or leak.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # AWS_DEPLOY_ROLE_ARN lives in:
          # GitHub → repo Settings → Secrets and variables → Actions
          # It's just an ARN but we keep it as a secret so it's
          # masked in logs and hidden from forked PRs.

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: meta
        run: |
          # Full SHA — not short SHA, not latest.
          # Short SHAs collide in large repos. Full SHA is unambiguous.
          URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}"
          echo "image_uri=${URI}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.image_uri }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --file docker/Dockerfile \
            .

      - name: Push
        run: docker push "${{ steps.meta.outputs.image_uri }}"


  # ── SECURITY SCAN ────────────────────────────────────────────
  # Runs against the image that just landed in ECR.
  # I went with Trivy over Snyk because:
  #   - no external account or token needed (one fewer secret)
  #   - scans OS packages and app dependencies in one shot
  #   - fast enough (~45s) to not annoy developers
  #
  # exit-code: 1 → job fails → pipeline stops → nothing deploys.
  # ignore-unfixed: true → skip CVEs with no patch yet. Blocking
  # a deploy for something unfixable just trains devs to ignore alerts.
  #
  # Checkov is bolted on here too. It catches Terraform mistakes
  # like Resource:"*" on IAM policies before they reach the account.
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ needs.build.outputs.image_uri }}
          format:         table
          exit-code:      1               # hard fail
          severity:       HIGH,CRITICAL   # MEDIUM/LOW don't block
          ignore-unfixed: true
          vuln-type:      os,library

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory:    terraform/
          framework:    terraform
          # CKV_AWS_107/108 → IAM wildcard actions/resources
          # CKV_AWS_111     → write perms without constraints
          # CKV_AWS_46      → hardcoded credentials in templates
          check:        CKV_AWS_107,CKV_AWS_108,CKV_AWS_111,CKV_AWS_46
          hard_fail_on: HIGH
          soft_fail:    false


  # ── DEPLOY → DEV (automatic) ─────────────────────────────────
  # Deploys on every push to main with no human in the loop.
  # environment: development maps to a GitHub Environment that has
  # NO required reviewers — gate is open, it just runs.
  #
  # Deploy pattern: pull current task def → swap image → register
  # new revision → update service. This preserves all existing
  # settings (cpu, memory, environment variables, injected secrets).
  # Only the image URI changes. Then we wait for stability so a
  # failed deploy is caught here, not discovered by a user.
  # ─────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    environment: development

    steps:
      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS — Dev
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          # Grab current task def, swap the image, drop read-only fields
          # that ECS rejects when you try to re-register them.
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition vidstream-dev-api \
            --query taskDefinition \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)')

          NEW_REV=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}-dev" \
            --service  vidstream-dev-api \
            --task-definition "$NEW_REV" \
            --force-new-deployment

          # Wait for steady state. ECS circuit breaker auto-rolls back
          # if the new tasks keep failing health checks — this step
          # will exit non-zero and flag it in the pipeline.
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}-dev" \
            --services vidstream-dev-api

      - name: Smoke test Dev
        run: |
          # Quick sanity check — confirm the container is up and
          # the health endpoint returns 200 before calling it done.
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 "${{ secrets.DEV_URL }}/health")
          [ "$STATUS" = "200" ] \
            || { echo "smoke test failed — HTTP $STATUS"; exit 1; }
          echo "smoke test passed (HTTP 200)"
          # DEV_URL is in GitHub Secrets — it's an internal ALB DNS
          # name, not sensitive per se, but we keep URLs in Secrets
          # so the same pipeline YAML works across forks without
          # exposing internal hostnames.


  # ── STAGING GATE (manual approval) ───────────────────────────
  # Pipeline parks here and emails whoever is listed as a required
  # reviewer on the "staging" GitHub Environment.
  # Set it up: repo Settings → Environments → staging → Required reviewers
  # Nobody approves → nothing deploys to staging. Simple as that.
  # ─────────────────────────────────────────────────────────────
  staging-gate:
    name: Staging Approval
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging

    steps:
      - name: Log who approved and what they approved
        run: |
          echo "Approved by : ${{ github.actor }}"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Image       : ${{ needs.build.outputs.image_uri }}"


  # ── DEPLOY → STAGING ─────────────────────────────────────────
  # Same pattern as dev. Only runs after a human clicked Approve
  # on the gate above — staging-gate is listed in needs[].
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, staging-gate]

    steps:
      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS — Staging
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition vidstream-staging-api \
            --query taskDefinition \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)')

          NEW_REV=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}-staging" \
            --service  vidstream-staging-api \
            --task-definition "$NEW_REV" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}-staging" \
            --services vidstream-staging-api

      - name: Smoke test Staging
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 "${{ secrets.STAGING_URL }}/health")
          [ "$STATUS" = "200" ] \
            || { echo "smoke test failed — HTTP $STATUS"; exit 1; }
          echo "smoke test passed"

      - name: Notify Slack
        if: always()
        run: |
          # SLACK_WEBHOOK_URL is in GitHub Secrets.
          # Even though a webhook URL isn't a password, it lets anyone
          # post to our ops channel — so it lives in Secrets and is
          # masked in logs automatically.
          if [ "${{ job.status }}" = "success" ]; then
            MSG="staging deploy done — \`${{ github.sha }}\` shipped by ${{ github.actor }}"
          else
            MSG="staging deploy FAILED — \`${{ github.sha }}\` — check Actions logs"
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"${MSG}\"}"
